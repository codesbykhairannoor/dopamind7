[providers]
php = true
node = true

[phases.setup]
nixPkgs = ['php83', 'php83Packages.intl', 'php83Packages.zip', 'nodejs_20', 'npm']

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm ci',
    'npm run build',
    'php artisan octane:install --server=roadrunner'
]

[phases.deploy]
cmds = [
    'php artisan optimize:clear',
    'php artisan migrate --force',
    'php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=$PORT'
]

[variables]
PHP_INI_SCAN_DIR = "/app:/usr/local/etc/php/conf.d"