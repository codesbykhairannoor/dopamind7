[phases.setup]
nixPkgs = ['php83', 'php83Packages.intl', 'php83Packages.zip', 'php83Packages.sockets', 'nodejs_20', 'npm']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-sockets',
    'npm ci'
]

[phases.build]
cmds = [
    'npm run build',
    'php artisan octane:install --server=roadrunner'
]

[phases.deploy]
cmds = [
    'php artisan optimize:clear',
    'php artisan migrate --force',
    'php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=$PORT'
]

[variables]
PHP_INI_SCAN_DIR = "/app:/usr/local/etc/php/conf.d"
COMPOSER_IGNORE_PLATFORM_REQS = "1"
COMPOSER_ALLOW_SUPERUSER = "1"
NIXPACKS_PHP_EXTENSIONS = "intl,zip,sockets,pdo_pgsql,redis"